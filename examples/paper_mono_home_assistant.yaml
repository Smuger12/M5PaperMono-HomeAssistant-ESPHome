# Public ESPHome Builder example.
# Change the Home Assistant entity IDs and the controls below for your setup.
# The firmware implementation is fetched from the repository's shared package
# and custom components; this file intentionally contains no implementation.
substitutions:
  # Define wifi_ssid and wifi_password in ESPHome's secrets.yaml.
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  device_name: paper-mono
  ha_weather_entity: weather.home
  ha_indoor_temperature_entity: sensor.indoor_temperature
  ha_indoor_humidity_entity: sensor.indoor_humidity
  ha_outdoor_pm25_entity: sensor.outdoor_pm25
  ha_indoor_co2_entity: sensor.indoor_co2
  ha_indoor_pm25_entity: sensor.indoor_pm25
  ha_indoor_voc_entity: sensor.indoor_voc
  ha_solar_power_entity: sensor.solar_power
  ha_house_power_entity: sensor.house_power
  ha_grid_import_entity: sensor.grid_import_power
  ha_grid_export_entity: sensor.grid_export_power
  ha_battery_charge_entity: sensor.battery_charge_power
  ha_battery_discharge_entity: sensor.battery_discharge_power
  ha_battery_soc_entity: sensor.battery_state_of_charge
  ha_notification_text_entity: input_text.paper_mono_notification
  frontlight_default_brightness: "30"
  frontlight_timeout_seconds: "30"
  sleep_timeout_seconds: "60"
  screensaver_refresh_minutes: "5"
  quiet_hours_start: "00:00"
  quiet_hours_end: "08:00"
  status_led_low_battery_threshold: "20"
  # The shared package keeps the local-development default for this value.
  # The public example must fetch the custom components from GitHub instead.
  components_source: github://hectorzin/M5PaperMono-HomeAssistant-ESPHome@main
  paper_mono_font: "https://raw.githubusercontent.com/hectorzin/M5PaperMono-HomeAssistant-ESPHome/main/fonts/DejaVuSans.ttf"

controls:
  blocks:
    - name: "Living room"
      nfc_id: "A145E804"
      entities:
        - entity_id: light.living_room
          name: Lights

        - entity_id: climate.living_room
          name: Climate

        - entity_id: cover.living_room_blind
          name: Blind

        - entity_id: media_player.living_room
          name: Media

    - name: "Garden"
      nfc_id: "044B2822BE7C80"
      entities:
        - entity_id: light.garden
          name: Lights

        - entity_id: switch.garden_outlet
          name: Outlet

packages:
  paper_mono_base: github://hectorzin/M5PaperMono-HomeAssistant-ESPHome/packages/paper_mono_base.yaml@main
