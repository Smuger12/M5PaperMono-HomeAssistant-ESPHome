# Shared PaperMono firmware implementation.
#
# The device YAML supplies the deployment-specific substitutions and controls.
# These defaults make the package reusable on its own while allowing a local
# device configuration to override every value below.
substitutions:
  device_name: paper-mono
  ha_weather_entity: weather.home
  ha_indoor_temperature_entity: sensor.indoor_temperature
  ha_indoor_humidity_entity: sensor.indoor_humidity
  ha_outdoor_pm25_entity: sensor.outdoor_pm25
  ha_indoor_co2_entity: sensor.indoor_co2
  ha_indoor_pm25_entity: sensor.indoor_pm25
  ha_indoor_voc_entity: sensor.indoor_voc
  ha_solar_power_entity: sensor.solar_power
  ha_house_power_entity: sensor.house_power
  ha_grid_import_entity: sensor.grid_import_power
  ha_grid_export_entity: sensor.grid_export_power
  ha_battery_charge_entity: sensor.battery_charge_power
  ha_battery_discharge_entity: sensor.battery_discharge_power
  ha_battery_soc_entity: sensor.battery_state_of_charge
  frontlight_default_brightness: "30"
  frontlight_timeout_seconds: "30"
  sleep_timeout_seconds: "60"
  screensaver_refresh_minutes: "5"
  quiet_hours_start: "00:00"
  quiet_hours_end: "08:00"
  status_led_low_battery_threshold: "20"
  ha_notification_text_entity: input_text.paper_mono_notification
  # Local development keeps using ./components. The public example overrides
  # this with the repository's GitHub external-components source.
  components_source: components
  paper_mono_font: "https://raw.githubusercontent.com/hectorzin/M5PaperMono-HomeAssistant-ESPHome/main/fonts/DejaVuSans.ttf"

packages:
  runtime_config: !include runtime_config.yaml
  core: !include core.yaml
  connectivity: !include connectivity.yaml
  hardware: !include hardware.yaml
  battery: !include battery.yaml
  status_led: !include status_led.yaml
  home_assistant_controls: !include home_assistant_controls.yaml
  home_assistant_runtime: !include home_assistant.yaml
  ui: !include ui.yaml
  frontlight: !include frontlight.yaml
